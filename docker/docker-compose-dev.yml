services:
  app:
    image: medgpt-fe:0.2
    ports:
      - "4200:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`) && !PathPrefix(`/api`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.entrypoints=web"
    networks:
      - pmd-nlp_rag-net
  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    env_file:
      - .env
    ports:
      - '${FASTAPI_PORT}:${FASTAPI_PORT}'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8888"
      - "traefik.http.routers.backend.entrypoints=web"
    extra_hosts:
#      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
#      - "host.docker.internal:172.21.0.1"
#    network_mode: "host"
    networks:
      - pmd-nlp_rag-net
  db:
    image: postgres:15-bullseye
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_TITLE}-db:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT}:5432'
    networks:
      - pmd-nlp_rag-net
  traefik:
    image: traefik:v3.2
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
    ports:
      - "8010:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

volumes:
  medgpt-api-db:
    name: ${PROJECT_TITLE}-db

networks:
  pmd-nlp_rag-net:
    external: true
